name: SignedIt Daily Social Content

on:
  schedule:
    # 9:00 AM UTC daily (4 AM EST / 5 AM CDT — posts live by morning feed)
    - cron: '0 9 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — generate content but skip posting to social media'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  generate-and-post:
    name: Generate content and post to LinkedIn + Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: signedit/social-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg (needed for Reel music mixing)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Run daily content generator
        run: node scripts/generate-daily-content.js
        env:
          # Anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

          # Media sources — alternate by week
          # Pexels (free at pexels.com/api) — odd weeks, provides video for Reels
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Unsplash (free at unsplash.com/developers) — even weeks, diverse professional photos
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

          # LinkedIn — posts to Company Page via Community Management API
          # Requires: "Community Management API" product added in LinkedIn Developer App
          # Token scopes: w_organization_social + r_organization_social
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          # LinkedIn App credentials — used for automatic token refresh
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}

          # Instagram — Business Account via Meta Graph API
          # Token needs: instagram_content_publish, instagram_basic, pages_read_engagement
          # Get from: Meta for Developers → your app → Instagram → access tokens
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

          # Meta App credentials — used for automatic Instagram token refresh
          # Get from: Meta for Developers → App Settings → Basic
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}

          # Jamendo — free music API for Reel background music
          # Get from: https://devportal.jamendo.com/ (sign up → create app → get client ID)
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}

          # Set to 'true' via workflow_dispatch to skip actual posting
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
